[tools]
# Runtimes
go = "latest"
node = "lts"
ruby = "4.0"

# Package managers
aube = "latest"
uv = "latest"

# Go tools
"go:golang.org/x/tools/cmd/goimports" = "latest"

# LSP servers
lua-language-server = "latest"
"npm:@ansible/ansible-language-server" = "latest"
"npm:bash-language-server" = "latest"
"npm:pyright" = "latest"
"gem:ruby-lsp" = "latest"
"npm:vscode-langservers-extracted" = "latest"
"npm:yaml-language-server" = "latest"

# Formatters
ruff = "latest"
shfmt = "latest"
stylua = "latest"
"npm:prettier" = "latest"
"npm:@fsouza/prettierd" = "latest"

# Linters
shellcheck = "latest"
"pipx:yamllint" = "latest"

# Utils
"npm:cf" = "latest"

# System packages; entries for a manager the machine lacks are skipped
[bootstrap.packages]
# macOS
"brew:bat"                     = { os = "macos" }
"brew:fd"                      = { os = "macos" }
"brew:gh"                      = { os = "macos" }
"brew:ripgrep"                 = { os = "macos" }
"brew:tmux"                    = { os = "macos" }
"brew:zsh-autosuggestions"     = { os = "macos" }
"brew:zsh-syntax-highlighting" = { os = "macos" }
"brew-cask:1password-cli"      = { os = "macos" }
"brew-cask:appcleaner"         = { os = "macos" }
"brew-cask:claude-code@latest" = { os = "macos" }
"brew-cask:codex"              = { os = "macos" }
"brew-cask:keepassxc"          = { os = "macos" }
"brew-cask:orbstack"           = { os = "macos" }
"brew-cask:rectangle-pro"      = { os = "macos" }

# Brew on every OS: Ubuntu's apt versions are often old
"brew:fish"                    = "latest"
"brew:neovim"                  = "latest"
"brew:zoxide"                  = "latest"
# nvim-treesitter builds parsers with it
"brew:tree-sitter-cli"         = "latest"
# Ubuntu and Fedora don't package these
"brew:jj"                      = "latest"
"brew:zsh-completions"         = "latest"

# Ubuntu
"apt:1password-cli"            = "latest"
"apt:bat"                      = "latest"
"apt:build-essential"          = "latest"
"apt:fd-find"                  = "latest"
"apt:gh"                       = "latest"
"apt:ripgrep"                  = "latest"
"apt:tmux"                     = "latest"
"apt:zsh"                      = "latest"
"apt:zsh-autosuggestions"      = "latest"
"apt:zsh-syntax-highlighting"  = "latest"

# Fedora
"dnf:@development-tools"       = "latest"
"dnf:1password-cli"            = "latest"
"dnf:bat"                      = "latest"
"dnf:fd-find"                  = "latest"
"dnf:gh"                       = "latest"
"dnf:ripgrep"                  = "latest"
"dnf:tmux"                     = "latest"
"dnf:zsh"                      = "latest"
"dnf:zsh-autosuggestions"      = "latest"
"dnf:zsh-syntax-highlighting"  = "latest"

# GitHub's own gh repos, per https://github.com/cli/cli/blob/trunk/docs/install_linux.md
[bootstrap.apt.sources.github-cli]
uris = "https://cli.github.com/packages"
suites = "stable"
key = "https://cli.github.com/packages/githubcli-archive-keyring.gpg"
fingerprint = "7F38 BBB5 9D06 4DBC B3D8 4D72 5612 B364 6231 3325"

# /bin/zsh is the macOS default and valid on Ubuntu and Fedora
[bootstrap.user]
login_shell = "/bin/zsh"

# Scripts live outside the dotfile groups: pre-packages runs before linking
[bootstrap.hooks]
pre-packages = [
  'sh "${DOTFILES:-$HOME/.dotfiles}/bootstrap/gh-repo.sh"',
  'sh "${DOTFILES:-$HOME/.dotfiles}/bootstrap/1password-repo.sh"',
]
post-packages = [
  'sh "${DOTFILES:-$HOME/.dotfiles}/bootstrap/fd-link.sh"',
  'sh "${DOTFILES:-$HOME/.dotfiles}/bootstrap/bat-link.sh"',
  'sh "${DOTFILES:-$HOME/.dotfiles}/bootstrap/claude-code.sh"',
]

[settings.dotfiles]
# Match the relative links stow created
relative_symlinks = true

# One group per directory in ~/.dotfiles, deployed file by file into ~
[dotfile_groups]
aube    = { root = "aube"   , exclude = [".DS_Store"] }
bat     = { root = "bat"    , exclude = [".DS_Store"] }
bin     = { root = "bin"    , exclude = [".DS_Store"] }
fish    = { root = "fish"   , exclude = [".DS_Store"] }
ghostty = { root = "ghostty", exclude = [".DS_Store"] }
git     = { root = "git"    , exclude = [".DS_Store"] }
jj      = { root = "jj"     , exclude = [".DS_Store"] }
kitty   = { root = "kitty"  , exclude = [".DS_Store"] }
mise    = { root = "mise"   , exclude = [".DS_Store"] }
mpv     = { root = "mpv"    , exclude = [".DS_Store"] }
nvim    = { root = "nvim"   , exclude = [".DS_Store"] }
ripgrep = { root = "ripgrep", exclude = [".DS_Store"] }
ruby    = { root = "ruby"   , exclude = [".DS_Store"] }
tmux    = { root = "tmux"   , exclude = [".DS_Store"] }
zsh     = { root = "zsh"    , exclude = [".DS_Store"] }
